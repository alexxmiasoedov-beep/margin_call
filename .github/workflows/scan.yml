# Запуск без своего сервера (репозиторий публичный — минуты Actions бесплатны):
#  * workflow_dispatch — сканер работает циклом ~5 ч 40 мин (опрос канала каждые
#    5 минут), сохраняет состояние каждые 10 минут и в конце САМ запускает
#    следующий такой же прогон. Так получается непрерывная цепочка.
#  * schedule (cron) — сторож: быстрый проход (--once) и перезапуск цепочки, если
#    она оборвалась. Пока цепочка жива, cron-запуски стоят в очереди
#    (concurrency) и отменяются следующим звеном цепочки — это нормально.
# Нужен секрет репозитория TG_BOT_TOKEN (Settings → Secrets and variables → Actions).
name: scan
on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      max_runtime_sec:
        description: "Сколько секунд работать циклом (по умолчанию 20400 = 5 ч 40 мин)"
        default: "20400"
        required: false
concurrency:
  group: scan
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      STATE_FILE: bot/state.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Git identity
        run: |
          git config user.name "margin-scanner"
          git config user.email "margin-scanner@users.noreply.github.com"
      - name: Scan
        run: |
          save() {
            git add bot/state.json
            git diff --cached --quiet && return 0
            git commit -qm "scanner: state $(date -u +%FT%TZ)" && git pull -q --rebase --autostash && git push -q || echo "::warning::не удалось сохранить состояние"
          }
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 bot/scanner.py --once
            save
            exit 0
          fi
          MAX_RUNTIME_SEC="${{ github.event.inputs.max_runtime_sec || '20400' }}" python3 bot/scanner.py --loop &
          PID=$!
          while kill -0 $PID 2>/dev/null; do
            sleep 600 & SLEEP=$!
            wait $SLEEP
            save
          done
          wait $PID || true
          save
      - name: Chain next run
        run: |
          for i in 1 2 3 4 5; do
            gh workflow run scan.yml --ref main && { echo "следующий прогон запущен"; exit 0; }
            sleep 30
          done
          echo "::error::не удалось запустить следующий прогон — цепочку перезапустит cron"
          exit 1
