# Вариант без своего сервера: GitHub Actions запускает один проход сканера
# каждые 5 минут (GitHub может задерживать cron на 5–15 минут в часы пик).
# Нужен секрет репозитория TG_BOT_TOKEN (Settings → Secrets and variables → Actions).
name: scan
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: scan
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan once
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          STATE_FILE: bot/state.json
        run: python3 bot/scanner.py --once
      - name: Save state
        run: |
          git config user.name "margin-scanner"
          git config user.email "margin-scanner@users.noreply.github.com"
          git add bot/state.json
          git diff --cached --quiet || (git commit -m "scanner: state $(date -u +%FT%TZ)" && git pull --rebase && git push)
